info:
  name: post /optimiser/room/:roomId/solve/me
  type: http
  seq: 5
  tags:
    - Optimiser

http:
  method: POST
  url: "{{baseUrl}}/optimiser/room/:roomId/solve/me"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "lockedLessons": [],
        "preferences": {
          "lunchBreak": "important",
          "earliestStart": "1000"
        },
        "includeFreeSlots": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Solo suggestions
    description: >-
      Only the caller's lessons may move, everyone else is frozen at their
      current slots and listed under frozen. Inline preferences override the
      caller's stored room row for this request only. Nothing is persisted and
      no hub broadcast is sent, so the returned solveId cannot be saved.
    request:
      url: "{{baseUrl}}/optimiser/room/:roomId/solve/me"
      method: POST
      params:
        - name: roomId
          value: 2c1f2f7e-fcb6-4a8d-8465-cf6d924b6133
          type: path
      body:
        type: json
        data: |-
          {
            "preferences": { "lunchBreak": "important" }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "optimal",
